name: Release

# 推送 v* 标签时触发：在各原生 runner 上分别打包，再汇总创建 GitHub Release。
# workflow_dispatch 用于手动验证构建（不创建 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 最小权限：仅 release job 需要写（创建 Release），见其 job 级 permissions；build job 默认只读

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 单平台失败不影响其它平台
      matrix:
        # 仅 CI 三平台：mac arm64 / Windows / Linux。
        # macOS Intel(x64) 不走 CI（macos-13 Intel runner 排队严重），改由维护者本机
        # 执行 `npm run dist:mac` 本地打包后 `gh release upload` 补传。
        include:
          - os: macos-latest # Apple Silicon arm64
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # tag 推送时校验 tag 版本与 package.json 一致，防止误发；手动触发跳过
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) 与 package.json version ($PKG_VERSION) 不一致"
            exit 1
          fi

      - name: Install dependencies
        # 用 npm install 而非 npm ci：本地(node24/npm11)与 CI(node20/npm10) 解析依赖树存在差异，
        # npm ci 的严格 lock 匹配在跨环境下会失败；npm install 按 package.json 解析更鲁棒
        run: npm install --no-audit --no-fund

      - name: Build distributables
        # --publish never：禁用 electron-builder 检测到 git tag 时的隐式 publish（缺 token 会失败）
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # CI 无证书，跳过 electron-builder 签名

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find dist/mac-arm64 -name '*.app' -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --sign - --deep --force "$APP_PATH"
            echo "✅ Ad-hoc signed: $APP_PATH"
            codesign --verify --deep --strict "$APP_PATH" && echo "✅ Signature verified"
          fi

      - name: Re-package DMG and ZIP after signing (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find dist/mac-arm64 -name '*.app' -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then exit 0; fi
          APP_NAME=$(basename "$APP_PATH" .app)
          VERSION=$(node -p "require('./package.json').version")

          # 构建含 Applications 快捷方式的 DMG
          DMG_PATH="dist/${APP_NAME}-${VERSION}-mac-arm64.dmg"
          rm -f "$DMG_PATH"
          DMG_STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "${APP_NAME} ${VERSION}-arm64" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_PATH"
          rm -rf "$DMG_STAGE"

          # 重新生成 ZIP
          ZIP_PATH="dist/${APP_NAME}-${VERSION}-mac-arm64.zip"
          rm -f "$ZIP_PATH"
          cd dist/mac-arm64 && zip -ry "../${APP_NAME}-${VERSION}-mac-arm64.zip" "$(basename "$APP_PATH")" && cd ../..

          echo "✅ Re-packaged: $DMG_PATH, $ZIP_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 仅 tag 推送时创建 Release；手动触发只验证构建
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # 需要 CHANGELOG.md 提取 notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # 各平台产物合并到同一目录

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # 字面匹配 "## [VERSION]" 段（index 避免正则注入），遇到下一个任意二级标题(## )即止（避免尾段如「## 版本说明」泄漏）
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && (/^## / || $0 == "---") { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 未找到版本 $VERSION 的段落，Release notes 将为空"
            printf '' > release-notes.md
          fi
          echo "--- release notes ---"; cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          draft: false
          prerelease: false
